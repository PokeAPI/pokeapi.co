name: Deploy Astro site to Pages

on:
  push:
    branches:
      - feat/astro-starlight

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-26.04-arm
    concurrency:
      group: ${{ github.workflow }}-build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile --prefer-offline --non-interactive

      - name: Cache Astro Build Cache
        uses: actions/cache@v6
        with:
          path: |
            .astro
            node_modules/.astro
          key: ${{ runner.os }}-${{ runner.arch }}-astro-build-${{ hashFiles('yarn.lock', '.nvmrc') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-astro-build-${{ hashFiles('yarn.lock', '.nvmrc') }}-

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build with Astro
        run: yarn build:ghpages

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    concurrency:
      group: "pages"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-26.04-arm
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
